server:
  port: 8080
spring:
  application:
    name: ai-travel-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel_planner}
    username: ${DB_USERNAME:travel_user}
    password: ${DB_PASSWORD:travel_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
