server:
  port: 8080

spring:
  application:
    name: ai-travel-planner
  datasource:
    # Defaults match compose.yaml. Override with DB_URL/DB_USERNAME/DB_PASSWORD outside local development.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/traveler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Root@Root@123}
  jpa:
    open-in-view: false
    hibernate:
      # SQL schema changes are applied manually; Hibernate only validates the mapped schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5-mini}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    enabled: ${APP_AI_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
